<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/articulo/art.css">
</head>
<body>

  <header class="site-header">
  <a href="/index.html" class="logo-link">
    <img src="/img/dufou.png" class="logo">
  </a>
  </header>

  <div id="banner" class="banner">
    <h1 id="titulo"></h1>
  </div>

  <section class="producto-detalle">
    <div class="carousel">
      <div class="carousel-track" id="carousel-track"></div>
      <button class="prev">‹</button>
      <button class="next">›</button>
    </div>


    <div id="descripcion" class="descripcion"></div>

    <section id="especificaciones" class="especificaciones">
    <div id="especificaciones-internal"></div>
 
    <div id="croquis" class="croquis"></div>
    </section>
    

    <a id="btn-whatsapp" class="whatsapp-btn" target="_blank">
      <img src="/img/Generic/wpp.svg" alt="WhatsApp">
      Consultar por WhatsApp
    </a>
  </section>

  <footer>
    <a href="/index.html" id="gobackref">← Volver al catálogo</a>
  </footer>

  <script>
    function SetWPP() {
      const mensaje = encodeURIComponent(`Hola! Me interesa el articulo ${prod.titulo}`);
      const link = `https://wa.me/5491138220688?text=${mensaje}`;
      document.getElementById('btn-whatsapp').href = link;
    }
    async function cargarProducto() {
      const params = new URLSearchParams(window.location.search);
      const modelo = params.get('mod');
      const brand = params.get('brand');
      if (!modelo || !brand) {
        document.body.innerHTML = `
        <h2>Producto no encontrado</h2>
        <h3>Por favor, consulte en nuestro whatsapp tocando el boton de abajo</h3>
        <a href="https://wa.me/5491138220688?text=Hola!" 
           target="_blank" 
           class="btn-whatsapp" 
           title="Chatear por WhatsApp">
          <img src="/img/Generic/wpp.svg" alt="WhatsApp">
        </a>
        `;
        SetWPP();
        return;
      }

      const response = await fetch(`/articulo/${brand}.json`);
      const productos = await response.json();
      const prod = productos.find(p => p.modelo === modelo);
      if (!prod) {
        document.body.innerHTML = `
        <h2>Producto no encontrado</h2>
        <h3>Por favor, consulte en nuestro whatsapp tocando el boton de abajo</h3>
        <a href="https://wa.me/5491138220688?text=Hola!" 
           target="_blank" 
           class="btn-whatsapp" 
           title="Chatear por WhatsApp">
          <img src="/img/Generic/wpp.svg" alt="WhatsApp">
        </a>
        `;
        SetWPP();
        return;
      }
      const gobackref = document.getElementById('gobackref');
      gobackref.href = prod.callback;
      // --- Botón WhatsApp dinámico ---

      // --- Banner ---
      const banner = document.getElementById('banner');
      banner.style.backgroundImage = `url('${prod.banner}')`;
      document.getElementById('titulo').textContent = prod.titulo;
      document.title = prod.titulo;

      // --- Carousel ---
      const track = document.getElementById('carousel-track');
      prod.imagenes.forEach(src => {
        const img = document.createElement('img');
        img.className = "img slide";
        img.src = src;
        track.appendChild(img);
      });

      // --- Descripción ---
      const descDiv = document.getElementById('descripcion');
      if (prod.descripcion) {
        descDiv.innerHTML = prod.descripcion;
      }
      // --- Especificaciones ---

      
      const especs = document.getElementById('especificaciones-internal');
      prod.especificaciones.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<img src="${item.icono}" alt=""> <span>${item.texto}</span>`;
        especs.appendChild(div);
      });

      // --- Croquis ---
      const croquisDiv = document.getElementById('croquis');
      if (prod.croquis) {
        croquisDiv.innerHTML = `<img src="${prod.croquis}" alt="Croquis">`;
      }

      // --- Lógica del carrusel ---
      const slides = Array.from(track.children);
      const nextButton = document.querySelector('.next');
      const prevButton = document.querySelector('.prev');
      let currentIndex = 0;

      function updateCarousel() {
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
      }

      nextButton.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateCarousel();
      });

      prevButton.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateCarousel();
      });

      setInterval(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateCarousel();
      }, 5000);
    }

    cargarProducto();
  </script>


    <a href="https://wa.me/5491138220688?text=Hola!" 
       target="_blank" 
       class="btn-whatsapp" 
       title="Chatear por WhatsApp">
      <img src="/img/Generic/wpp.svg" alt="WhatsApp">
    </a>
</body>
</html>
